<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西鉄天神大牟田線 列車位置情報</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #008060;
      --line-color: #888888;
      --station-circle-bg: #ffffff;
      --station-circle-border: #666666;

      /* 種別カラー */
      --color-loc: #0070c0; /* 青（普通） */
      --color-exp: #00b050; /* 緑（急行） */
      --color-ltd: #ff0000; /* 赤（特急） */
      --color-def: #7f7f7f; /* デフォルト */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 15px;
      text-align: center;
    }

    .status-bar {
      font-size: 0.85rem;
      color: #666;
      margin-top: 5px;
    }

    /* 路線図全体コンテナ */
    .diagram-container {
      width: 100%;
      max-width: 520px;
      border: 1px solid #ddd;
      padding: 20px 10px;
      background: #fff;
    }

    .terminals {
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
      padding: 5px 0;
    }

    /* グリッドレイアウト (左:上り2列 / 中央:駅名 / 右:下り2列) */
    .diagram-grid {
      display: grid;
      grid-template-columns: 60px 60px 180px 60px 60px;
      justify-content: center;
      row-gap: 0px;
    }

    .grid-row {
      display: contents;
    }

    .grid-cell {
      height: 80px; /* アイコンが入るよう高さを確保 */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 縦の線路 */
    .track-cell::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background-color: var(--line-color);
      transform: translateX(-50%);
      z-index: 1;
    }

    /* 中央の駅セル */
    .station-center-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* 駅の「○」シンボル */
    .station-node {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--station-circle-bg);
      border: 3px solid var(--station-circle-border);
      z-index: 3;
    }

    /* 駅名とナンバリング */
    .station-info {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.9);
      padding: 0 4px;
      z-index: 4;
    }

    .station-number {
      display: inline-block;
      background: #005bb5;
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 3px;
      border-radius: 2px;
    }

    .station-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-color);
      text-decoration: underline;
      margin-left: 2px;
    }

    /* 横断線（駅の水平線） */
    .station-row .track-cell::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 100%;
      height: 2px;
      background-color: #ccc;
      transform: translateY(-50%);
      z-index: 1;
    }

    /* --------------------------------------------------
       列車アイコン（完全再現デザイン）
    -------------------------------------------------- */
    .train-icon {
      position: relative;
      z-index: 10;
      width: 52px;
      height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 2px solid transparent;
      box-sizing: border-box;
      filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3));
    }

    /* 種別ごとの線・文字色・背景定義 */
    .train-icon.color-loc {
      border-color: var(--color-loc);
      background-color: var(--color-loc);
      color: var(--color-loc);
    }
    .train-icon.color-exp {
      border-color: var(--color-exp);
      background-color: var(--color-exp);
      color: var(--color-exp);
    }
    .train-icon.color-ltd {
      border-color: var(--color-ltd);
      background-color: var(--color-ltd);
      color: var(--color-ltd);
    }
    .train-icon.color-def {
      border-color: var(--color-def);
      background-color: var(--color-def);
      color: var(--color-def);
    }

    /* --- 下り（尖りが下） --- */
    .train-icon.train-down {
      clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 50% 100%, 0% 80%);
      padding-bottom: 6px;
    }

    /* --- 上り（尖りが上） --- */
    .train-icon.train-up {
      clip-path: polygon(50% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%);
      padding-top: 6px;
    }

    /* 列車番号部分 (白背景＋種別カラー文字) */
    .train-number-box {
      width: 100%;
      background-color: #ffffff;
      font-size: 0.75rem;
      font-weight: 900;
      text-align: center;
      padding: 1px 0;
      line-height: 1.1;
      color: inherit;
    }

    /* 行先名 (カラー背景＋白文字) */
    .train-dest-box {
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      line-height: 1;
      letter-spacing: -0.5px;
      margin: auto 0;
    }

    /* 車両数＋ドア数バッジ (白カプセル＋黒文字) */
    .train-cars-badge {
      background-color: #ffffff;
      color: #000000;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 0px 8px;
      border-radius: 10px;
      line-height: 1.2;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <header>
    <h2>西鉄天神大牟田線 列車位置</h2>
    <div class="status-bar" id="statusBar">データ取得中...</div>
  </header>

  <div class="diagram-container">
    <div class="terminals">▲ 西鉄福岡（天神）</div>
    
    <div class="diagram-grid" id="diagramGrid"></div>

    <div class="terminals" style="margin-top: 10px;">▼ 大牟田</div>
  </div>

  <script>
    // --- 1. 本線 50駅の定義 ---
    const STATIONS = [
      { row: 1, name: "西鉄福岡(天神)", num: "T01" },
      { row: 4, name: "薬院", num: "T02" },
      { row: 7, name: "西鉄平尾", num: "T03" },
      { row: 10, name: "高宮", num: "T04" },
      { row: 13, name: "大橋", num: "T05" },
      { row: 16, name: "井尻", num: "T06" },
      { row: 19, name: "雑餉隈", num: "T07" },
      { row: 22, name: "桜並木", num: "T08" },
      { row: 25, name: "春日原", num: "T09" },
      { row: 28, name: "白木原", num: "T10" },
      { row: 31, name: "下大利", num: "T11" },
      { row: 34, name: "都府楼前", num: "T12" },
      { row: 37, name: "西鉄二日市", num: "T13" },
      { row: 40, name: "紫", num: "T14" },
      { row: 43, name: "朝倉街道", num: "T15" },
      { row: 46, name: "桜台", num: "T16" },
      { row: 49, name: "筑紫", num: "T17" },
      { row: 52, name: "津古", num: "T18" },
      { row: 55, name: "三国が丘", num: "T19" },
      { row: 58, name: "三沢", num: "T20" },
      { row: 61, name: "大保", num: "T21" },
      { row: 64, name: "西鉄小郡", num: "T22" },
      { row: 67, name: "端間", num: "T23" },
      { row: 70, name: "味坂", num: "T24" },
      { row: 73, name: "宮の陣", num: "T25" },
      { row: 76, name: "櫛原", num: "T26" },
      { row: 79, name: "西鉄久留米", num: "T27" },
      { row: 82, name: "花畑", num: "T28" },
      { row: 85, name: "聖マリア病院前", num: "T29" },
      { row: 88, name: "津福", num: "T30" },
      { row: 91, name: "安武", num: "T31" },
      { row: 94, name: "大善寺", num: "T32" },
      { row: 97, name: "三潴", num: "T33" },
      { row: 100, name: "犬塚", num: "T34" },
      { row: 103, name: "大溝", num: "T35" },
      { row: 106, name: "八丁牟田", num: "T36" },
      { row: 109, name: "蒲池", num: "T37" },
      { row: 112, name: "矢加部", num: "T38" },
      { row: 115, name: "西鉄柳川", num: "T39" },
      { row: 118, name: "徳益", num: "T40" },
      { row: 121, name: "塩塚", num: "T41" },
      { row: 124, name: "西鉄中島", num: "T42" },
      { row: 127, name: "江の浦", num: "T43" },
      { row: 130, name: "開", num: "T44" },
      { row: 133, name: "西鉄渡瀬", num: "T45" },
      { row: 136, name: "倉永", num: "T46" },
      { row: 139, name: "東甘木", num: "T47" },
      { row: 142, name: "西鉄銀水", num: "T48" },
      { row: 145, name: "新栄町", num: "T49" },
      { row: 148, name: "大牟田", num: "T50" }
    ];

    const TOTAL_ROWS = 148;
    const TARGET_API = "https://busnavi-railway.nnr.co.jp/tenjin_omuta/tenjin-omuta.json";

    // 5系統のCORSプロキシ
    const PROXY_GENERATORS = [
      (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
      (url) => `https://jsonp.afeld.me/?url=${encodeURIComponent(url)}`
    ];

    // アルファベット変換テーブル
    const ALPHA_MAP = {
      '1': 'A',
      '7': 'G',
      'A': 'J',
      'B': 'K',
      'C': 'L',
      'D': 'H',
      '5': 'S'
    };

    // --- 2. 列車番号フォーマット変換処理 ---
    function formatTrainNumber(rawStr) {
      if (!rawStr || rawStr.length < 10) return "****";

      // 4, 6, 8, 10番目の文字（0-indexedでは 3, 5, 7, 9）
      let c4 = rawStr.charAt(3);
      let c6 = rawStr.charAt(5);
      let c8 = rawStr.charAt(7);
      let c10 = rawStr.charAt(9);

      // 3番目の文字（0-indexedでは 2）
      const c3 = rawStr.charAt(2);

      // 3番目の文字が '4' なら1桁目をアルファベット変換
      if (c3 === '4') {
        c4 = ALPHA_MAP[c4] || c4;
      }

      return `${c4}${c6}${c8}${c10}`;
    }

    // --- 3. 行先駅名の短縮ルール（3文字以内） ---
    function formatStationName(name) {
      if (!name) return "不明";
      
      const replaceRules = {
        "西鉄福岡（天神）": "福岡",
        "西鉄福岡(天神)": "福岡",
        "西鉄二日市": "二日市",
        "西鉄小郡": "小郡",
        "西鉄久留米": "久留米",
        "西鉄柳川": "柳川"
      };

      if (replaceRules[name]) return replaceRules[name];

      // それ以外の「西鉄〇〇」等の表記調整
      return name.replace(/^西鉄/, "").substring(0, 3);
    }

    // --- 4. プロキシ取得用ネットワーク関数 ---
    async function fetchWithRetry(url) {
      const cacheBusterUrl = `${url}${url.includes('?') ? '&' : '?'}_t=${Date.now()}`;

      for (let i = 0; i < PROXY_GENERATORS.length; i++) {
        const proxyUrl = PROXY_GENERATORS[i](cacheBusterUrl);
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);

          const res = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const text = await res.text();
            const data = JSON.parse(text);

            if (data && (data.locationObjects || data.fileVersion)) {
              return data;
            }
          }
        } catch (e) {
          console.warn(`プロキシ [${i + 1}/${PROXY_GENERATORS.length}] リトライ中...`);
        }
      }
      throw new Error("プロキシ経由の取得失敗");
    }

    // --- 5. 画面（CSS Grid）初期生成 ---
    function buildGrid() {
      const grid = document.getElementById("diagramGrid");
      const stationMap = new Map(STATIONS.map(s => [s.row, s]));
      let html = "";

      for (let r = 1; r <= TOTAL_ROWS; r++) {
        const station = stationMap.get(r);
        const isStation = !!station;
        const rowClass = isStation ? "station-row" : "section-row";

        html += `<div class="grid-row ${rowClass}" data-row="${r}">`;

        // Col 1 & 2 (上り線路)
        html += `<div class="grid-cell track-cell" data-col="1"></div>`;
        html += `<div class="grid-cell track-cell" data-col="2"></div>`;

        // 中央 (駅名)
        if (isStation) {
          html += `
            <div class="grid-cell station-center-cell">
              <div class="station-node"></div>
              <div class="station-info">
                <span class="station-number">${station.num}</span>
                <span class="station-name">${station.name}</span>
              </div>
            </div>`;
        } else {
          html += `<div class="grid-cell"></div>`;
        }

        // Col 3 & 4 (下り線路)
        html += `<div class="grid-cell track-cell" data-col="3"></div>`;
        html += `<div class="grid-cell track-cell" data-col="4"></div>`;

        html += `</div>`;
      }

      grid.innerHTML = html;
    }

    // --- 6. 列車アイコンの動的構築 ＆ 描画 ---
    async function fetchAndRender() {
      const statusBar = document.getElementById("statusBar");

      try {
        const data = await fetchWithRetry(TARGET_API);

        // 既存の全アイコン消去
        document.querySelectorAll(".train-icon").forEach(el => el.remove());

        let count = 0;

        if (data && data.locationObjects) {
          data.locationObjects.forEach(loc => {
            const row = parseInt(loc.locationRow, 10);
            const col = parseInt(loc.locationCol, 10);

            // 本線 col 1~4 のみ対象
            if (row === 0 || isNaN(row) || col < 1 || col > 4) return;

            const targetCell = document.querySelector(`.grid-row[data-row="${row}"] .grid-cell[data-col="${col}"]`);
            if (!targetCell) return;

            loc.trainInfoObjects.forEach(info => {
              count++;

              // 1. 方向 (1:上り, 他:下り)
              const isUp = loc.trainDirection === "1";
              const dirClass = isUp ? "train-up" : "train-down";

              // 2. 種別カラー (loc:普通, exp:急行, ltd:特急)
              const colorType = info.trainColorType || "loc";
              const colorClass = `color-${colorType}`;

              // 3. 列車番号 (例: A162)
              const formattedTrainNum = formatTrainNumber(info.trainNumber);

              // 4. 行先名 (例: 福岡)
              const destShortName = formatStationName(info.destStationName);

              // 5. 両数+ドア数 (例: 43)
              const carsStr = String(info.carsOfTrain || "0");
              const doorsStr = String(info.doorsOfCar || "0");
              const carsDoorsCombined = `${carsStr}${doorsStr}`;

              // --- アイコンエレメントの組み立て ---
              const icon = document.createElement("div");
              icon.className = `train-icon ${dirClass} ${colorClass}`;
              icon.title = `列車番号: ${formattedTrainNum} (${info.trainNumber})\n種別: ${info.trainType}\n行先: ${info.destStationName}\n編成: ${carsStr}両 / ${doorsStr}ドア`;

              const numberBox = `<div class="train-number-box">${formattedTrainNum}</div>`;
              const destBox = `<div class="train-dest-box">${destShortName}</div>`;
              const carsBadge = `<div class="train-cars-badge">${carsDoorsCombined}</div>`;

              // 上りと下りで並び順を変更
              if (isUp) {
                // 上り: [両数ドア数] -> [行先] -> [列車番号]
                icon.innerHTML = `${carsBadge}${destBox}${numberBox}`;
              } else {
                // 下り: [列車番号] -> [行先] -> [両数ドア数]
                icon.innerHTML = `${numberBox}${destBox}${carsBadge}`;
              }

              targetCell.appendChild(icon);
            });
          });
        }

        const now = new Date();
        statusBar.textContent = `最終更新: ${now.toLocaleTimeString()} （本線走行中: ${count}本）`;

      } catch (err) {
        console.error("データ取得失敗:", err);
        statusBar.textContent = "一時通信エラー（自動再試行します）";
      }
    }

    // --- 7. 無限ループレフレッシュ（12秒周期） ---
    async function startAutoUpdate() {
      buildGrid();

      while (true) {
        await fetchAndRender();
        await new Promise(resolve => setTimeout(resolve, 12000));
      }
    }

    // 起動
    startAutoUpdate();
  </script>
</body>
</html>
