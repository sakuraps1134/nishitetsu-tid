<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天神大牟田線 列車在線位置</title>
  <!-- Excel読み込み用 SheetJS ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Inter:wght@600;800;900&display=swap');

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --station-text: #008060;
      --line-color: #94a3b8;
      --single-track-bg: rgba(245, 158, 11, 0.08);
      --single-track-line: #f59e0b;

      /* 種別カラー */
      --color-loc: #3b82f6; /* 普通 */
      --color-exp: #16a34a; /* 急行 */
      --color-ltd: #dc2626; /* 特急 */
      --color-out: #64748b; /* 回送 */
      --color-sight: #ffffff; /* 観光 */
      --color-def: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'BIZ UDPGothic', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 0 5px 10px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      position: sticky; top: 0; z-index: 100; width: 100%;
      background-color: rgba(148, 255, 239, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 0; margin-bottom: 10px;
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
      border-bottom: 3px solid #C30000;
    }

    h2 { font-size: 1.2rem; font-weight: 700; }

    .status-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .status-bar { font-size: 0.75rem; color: var(--text-sub); }

    .reload-btn {
      background-color: #c30000; color: #ffffff; border: none;
      padding: 4px 12px; font-size: 0.75rem; font-weight: 700; border-radius: 16px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }

    .header-alerts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .alert-badge {
      background-color: #dc2626; color: #ffffff; font-size: 0.72rem;
      font-weight: 800; padding: 2px 8px; border-radius: 4px;
    }

    .diagram-container {
      width: 100%; max-width: 480px; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 10px 4px; background: var(--card-bg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .terminals { text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); }

    .diagram-grid {
      display: grid; grid-template-columns: 46px 46px 150px 46px 46px;
      justify-content: center; row-gap: 0px;
    }

    .grid-row { display: contents; }
    .grid-cell { height: 48px; position: relative; display: flex; align-items: center; justify-content: center; }

    .track-cell::before {
      content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
      width: 2px; background-color: var(--line-color); transform: translateX(-50%); z-index: 1;
    }

    .grid-row.is-single-track .track-cell::before { display: none; }
    .grid-row.is-single-track .grid-cell { background-color: var(--single-track-bg); }
    .grid-row.is-single-track .station-center-cell::before {
      content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
      width: 3px; background-color: var(--single-track-line); transform: translateX(-50%); z-index: 1;
    }

    .grid-row[data-row="1"] .track-cell::before { top: 50%; }
    .grid-row[data-row="148"] .track-cell::before { bottom: 50%; }

    .station-center-cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
    .station-node { width: 13px; height: 13px; border-radius: 50%; background-color: var(--card-bg); border: 3px solid #334155; z-index: 3; }
    .station-info {
      position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
      background: rgba(255, 255, 255, 0.95); padding: 1px 6px; border-radius: 4px; z-index: 4;
      display: flex; align-items: center; gap: 3px;
    }
    .station-number { background: #0284c7; color: #fff; font-size: 0.68rem; font-weight: 800; padding: 1px 4px; border-radius: 3px; }
    .station-name { font-size: 0.88rem; font-weight: 800; color: var(--station-text); text-decoration: underline; }

    .train-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    .delay-badge { color: #dc2626; font-size: 0.8rem; font-weight: 900; line-height: 1; z-index: 20; text-shadow: 0px 0px 2px #fff; }

    .train-icon {
      position: relative; width: 42px; height: 44px; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; border: 1px solid transparent; box-sizing: border-box;
      filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.25)); transition: transform 0.1s ease;
    }
    .train-icon:hover { transform: scale(1.08); }

    .train-icon.color-loc { border-color: var(--color-loc); background-color: var(--color-loc); color: var(--color-loc); }
    .train-icon.color-exp { border-color: var(--color-exp); background-color: var(--color-exp); color: var(--color-exp); }
    .train-icon.color-ltd { border-color: var(--color-ltd); background-color: var(--color-ltd); color: var(--color-ltd); }
    .train-icon.color-out { border-color: #475569; background-color: var(--color-out); color: var(--color-out); }
    .train-icon.color-sight { border-color: #0284c7; background-color: var(--color-sight); color: #0284c7; }
    .train-icon.color-sight .train-dest-box { color: #0f172a; }
    .train-icon.color-def, .train-icon.color-multi { border-color: var(--color-def); background-color: var(--color-def); color: var(--color-def); }

    .train-icon.train-down { clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 50% 100%, 0% 80%); padding-bottom: 3px; }
    .train-icon.train-up { clip-path: polygon(50% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%); padding-top: 3px; }

    .train-number-box { width: 100%; background-color: #ffffff; font-size: 0.6rem; font-weight: 800; text-align: center; color: inherit; }
    .train-dest-box { color: #ffffff; font-size: 0.68rem; font-weight: 700; text-align: center; margin: auto 0; }
    .train-cars-badge { background-color: #ffffff; color: #000000; font-size: 0.58rem; font-weight: 800; padding: 0px 5px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .multi-count-box { color: #ffffff; font-size: 1.1rem; font-weight: 900; margin: auto 0; }

    /* モーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { width: 90%; max-width: 380px; max-height: 85vh; background-color: #ffffff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #cbd5e1; }
    .modal-header { background-color: var(--color-loc); color: #ffffff; padding: 12px 14px; display: flex; gap: 12px; align-items: center; position: relative; }
    .modal-header.color-exp { background-color: var(--color-exp); }
    .modal-header.color-ltd { background-color: var(--color-ltd); }
    .modal-header.color-out { background-color: var(--color-out); }
    .modal-header.color-sight { background-color: #0284c7; color: #ffffff; }
    .modal-header.color-def { background-color: var(--color-def); }
    .modal-train-img-container { display: flex; flex-direction: column; align-items: center; width: 90px; height: 70px; flex-shrink: 0; justify-content: center; }
    .modal-train-img { width: 80px; height: 52px; object-fit: contain; background: #ffffff; border-radius: 4px; opacity: 0; transition: opacity 0.2s; }
    .modal-train-img.loaded { opacity: 1; }
    .modal-sharyo-text { font-size: 0.72rem; font-weight: 800; margin-top: 3px; color: #ffffff; text-align: center; white-space: nowrap; overflow: hidden; width: 100%; }
    .modal-header-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .modal-title-main { font-size: 1.25rem; font-weight: 900; }
    .modal-sub-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px; }
    .modal-train-no { font-size: 1.05rem; font-weight: 800; }
    .modal-cars-doors { font-size: 0.85rem; font-weight: 700; }
    .modal-close-btn { position: absolute; top: 6px; right: 10px; background: none; border: none; color: rgba(255, 255, 255, 0.8); font-size: 1.5rem; cursor: pointer; }
    .modal-body { flex: 1; overflow-y: auto; padding: 12px; }
    .timetable-table { width: 100%; border-collapse: collapse; }
    .timetable-table th, .timetable-table td { padding: 6px 8px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; font-weight: 700; }
    .timetable-table th.time-col, .timetable-table td.time-col { text-align: right; }
    .timetable-loading { text-align: center; padding: 30px; color: var(--text-sub); }
  </style>
</head>
<body>

  <header>
    <h2>天神大牟田線 列車在線位置</h2>
    <div class="status-container">
      <button class="reload-btn" onclick="manualReload()">↺ 更新</button>
      <div class="status-bar" id="statusBar">データ取得中...</div>
    </div>
    <div class="header-alerts" id="headerAlerts"></div>
  </header>

  <div class="diagram-container">
    <div class="terminals">▲ 西鉄福岡（天神）</div>
    <div class="diagram-grid" id="diagramGrid"></div>
    <div class="terminals" style="margin-top: 6px;">▼ 大牟田</div>
  </div>

  <!-- 詳細表示モーダル -->
  <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header" id="modalHeader">
        <button class="modal-close-btn" onclick="closeModal()">×</button>
        <div class="modal-train-img-container">
          <img id="modalTrainImg" src="" class="modal-train-img" alt="列車">
          <div class="modal-sharyo-text" id="modalSharyoText">----</div>
        </div>
        <div class="modal-header-info">
          <div class="modal-title-main" id="modalTitle">---- 行</div>
          <div class="modal-sub-info">
            <div class="modal-train-no" id="modalTrainNo">第----列車</div>
            <div class="modal-cars-doors" id="modalCarsDoors">-両-ドア</div>
          </div>
        </div>
      </div>
      <div class="modal-body" id="modalBody">
        <div class="timetable-loading">時刻表読込中...</div>
      </div>
    </div>
  </div>

  <script>
    /* ----------------------------------------------------
       ★ GitHubのExcelファイルURL設定箇所
    ---------------------------------------------------- */
    const GITHUB_EXCEL_URLS = {
      mon: "https://raw.githubusercontent.com/sakuraps1134/nishitetsu-tid/main/1.xlsx",
      tue: "https://raw.githubusercontent.com/sakuraps1134/nishitetsu-tid/main/1.xlsx",
      wed: "https://raw.githubusercontent.com/sakuraps1134/nishitetsu-tid/main/1.xlsx",
      thu: "https://raw.githubusercontent.com/sakuraps1134/nishitetsu-tid/main/1.xlsx",
      fri: "https://raw.githubusercontent.com/sakuraps1134/nishitetsu-tid/main/1.xlsx",
      holiday: "https://raw.githubusercontent.com/ユーザー名/リポジトリ名/main/holiday.xlsx"
    };

    const STATIONS = [
      { row: 1, name: "西鉄福岡(天神)", num: "T01" }, { row: 4, name: "薬院", num: "T02" }, { row: 7, name: "西鉄平尾", num: "T03" },
      { row: 10, name: "高宮", num: "T04" }, { row: 13, name: "大橋", num: "T05" }, { row: 16, name: "井尻", num: "T06" },
      { row: 19, name: "雑餉隈", num: "T07" }, { row: 22, name: "桜並木", num: "T08" }, { row: 25, name: "春日原", num: "T09" },
      { row: 28, name: "白木原", num: "T10" }, { row: 31, name: "下大利", num: "T11" }, { row: 34, name: "都府楼前", num: "T12" },
      { row: 37, name: "西鉄二日市", num: "T13" }, { row: 40, name: "紫", num: "T14" }, { row: 43, name: "朝倉街道", num: "T15" },
      { row: 46, name: "桜台", num: "T16" }, { row: 49, name: "筑紫", num: "T17" }, { row: 52, name: "津古", num: "T18" },
      { row: 55, name: "三国が丘", num: "T19" }, { row: 58, name: "三沢", num: "T20" }, { row: 61, name: "大保", num: "T21" },
      { row: 64, name: "西鉄小郡", num: "T22" }, { row: 67, name: "端間", num: "T23" }, { row: 70, name: "味坂", num: "T24" },
      { row: 73, name: "宮の陣", num: "T25" }, { row: 76, name: "櫛原", num: "T26" }, { row: 79, name: "西鉄久留米", num: "T27" },
      { row: 82, name: "花畑", num: "T28" }, { row: 85, name: "聖マリア病院前", num: "T29" }, { row: 88, name: "津福", num: "T30" },
      { row: 91, name: "安武", num: "T31" }, { row: 94, name: "大善寺", num: "T32" }, { row: 97, name: "三潴", num: "T33" },
      { row: 100, name: "犬塚", num: "T34" }, { row: 103, name: "大溝", num: "T35" }, { row: 106, name: "八丁牟田", num: "T36" },
      { row: 109, name: "蒲池", num: "T37" }, { row: 112, name: "矢加部", num: "T38" }, { row: 115, name: "西鉄柳川", num: "T39" },
      { row: 118, name: "徳益", num: "T40" }, { row: 121, name: "塩塚", num: "T41" }, { row: 123, name: "中島信号場", num: "信" },
      { row: 124, name: "西鉄中島", num: "T42" }, { row: 127, name: "江の浦", num: "T43" }, { row: 130, name: "開", num: "T44" },
      { row: 133, name: "西鉄渡瀬", num: "T45" }, { row: 136, name: "倉永", num: "T46" }, { row: 139, name: "東甘木", num: "T47" },
      { row: 142, name: "西鉄銀水", num: "T48" }, { row: 145, name: "新栄町", num: "T49" }, { row: 150, name: "大牟田", num: "T50" }
    ];

    const TOTAL_ROWS = 148;
    const TARGET_API = "https://busnavi-railway.nnr.co.jp/tenjin_omuta/tenjin-omuta.json";
    const DEFAULT_ICON = "https://img.elesite-next.com/rosen_icon/nishitetsu_omuta/9000%E5%BD%A29000.webp";

    const PROXY_GENERATORS = [
      (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    ];

    const ALPHA_MAP = { '1':'A', '7':'G', 'A':'J', 'B':'K', 'C':'L', 'D':'H', '5':'S' };
    const TYPE_PRIORITY = { 'ltd': 5, 'exp': 4, 'sight': 3, 'loc': 2, 'out': 1 };

    let timetableDataCache = null;
    let cachedIsHoliday = null;
    let manualScheduleList = [];
    let currentLoadedDayKey = "";

    function isSingleTrackRow(row) {
      return (row >= 85 && row <= 94) || (row >= 112 && row <= 130);
    }

    const stationRowSet = new Set(STATIONS.map(s => s.row));
    function isStationRow(row) { return stationRowSet.has(row); }

    function formatTrainNumber(rawStr) {
      if (!rawStr) return "****";
      if (rawStr.length < 10) return rawStr;
      let c4 = rawStr.charAt(3), c6 = rawStr.charAt(5), c8 = rawStr.charAt(7), c10 = rawStr.charAt(9);
      if (rawStr.charAt(2) === '4') c4 = ALPHA_MAP[c4] || c4;
      return `${c4}${c6}${c8}${c10}`;
    }

    function formatStationName(name) {
      if (!name) return "不明";
      const replaceRules = {
        "西鉄福岡（天神）": "福岡", "西鉄福岡(天神)": "福岡",
        "西鉄二日市": "二日市", "西鉄小郡": "小郡", "西鉄久留米": "久留米", "西鉄柳川": "柳川"
      };
      return replaceRules[name] || name.replace(/^西鉄/, "").substring(0, 3);
    }

    function isHolidayJST() {
      const day = new Date().getDay();
      return (day === 0 || day === 6);
    }

    function getTodayKey() {
      const day = new Date().getDay();
      if (day === 0 || day === 6) return "holiday";
      const dayKeys = ["holiday", "mon", "tue", "wed", "thu", "fri", "holiday"];
      return dayKeys[day];
    }

    // HH:mm または HH:mm:ss 文字列を「その日の開始からの経過秒数」に変換
    function timeToSeconds(timeStr) {
      if (!timeStr) return null;
      const parts = String(timeStr).trim().split(':');
      if (parts.length < 2) return null;
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const s = parts.length >= 3 ? parseInt(parts[2], 10) : 0;
      return h * 3600 + m * 60 + s;
    }

    async function fetchGitHubExcel() {
      const dayKey = getTodayKey();
      const excelUrl = GITHUB_EXCEL_URLS[dayKey];

      if (!excelUrl || excelUrl.includes("ユーザー名")) return;
      if (currentLoadedDayKey === dayKey && manualScheduleList.length > 0) return;

      try {
        const response = await fetch(excelUrl);
        if (!response.ok) throw new Error("Excel取得失敗");
        
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        
        manualScheduleList = XLSX.utils.sheet_to_json(firstSheet);
        currentLoadedDayKey = dayKey;
        console.log(`GitHub Excel(${dayKey})をロード完了: ${manualScheduleList.length}件の区間情報`);
      } catch (err) {
        console.error("GitHub Excel読み込みエラー:", err);
      }
    }

    /* ----------------------------------------------------
       補間アルゴリズム：時刻から現在のrowを自動算出
    ---------------------------------------------------- */
    function getActiveManualTrains() {
      if (!manualScheduleList || manualScheduleList.length === 0) return [];

      const now = new Date();
      const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      const activeList = [];

      manualScheduleList.forEach(item => {
        const depSec = timeToSeconds(item.depTime);
        const arrSec = timeToSeconds(item.arrTime);
        const depRow = parseInt(item.depRow, 10);
        const arrRow = parseInt(item.arrRow, 10);

        if (depSec === null || arrSec === null || isNaN(depRow) || isNaN(arrRow)) return;

        // 現在時刻がこの「発〜着」の範囲内に入っている場合のみ計算
        if (currentSec >= depSec && currentSec <= arrSec) {
          let calculatedRow = depRow;

          if (arrSec > depSec) {
            // 時間の通過割合（0.0 〜 1.0）
            const progress = (currentSec - depSec) / (arrSec - depSec);
            // 比例計算して現在のrowを決定
            calculatedRow = Math.round(depRow + (arrRow - depRow) * progress);
          }

          let colorType = "def";
          const typeStr = String(item.trainType || "");
          if (typeStr.includes("回送")) colorType = "out";
          else if (typeStr.includes("観光")) colorType = "sight";
          else if (typeStr.includes("特急")) colorType = "ltd";
          else if (typeStr.includes("急行")) colorType = "exp";
          else if (typeStr.includes("普通")) colorType = "loc";

          activeList.push({
            locationRow: String(calculatedRow),
            locationCol: item.isUp == 1 ? "2" : "3",
            trainDirection: String(item.isUp),
            trainInfoObjects: [{
              trainNumber: String(item.trainNumber || "回送"),
              trainType: typeStr,
              destStationName: String(item.destStationName || "---"),
              carsOfTrain: String(item.cars || "4"),
              doorsOfCar: String(item.doors || "3"),
              trainColorType: colorType,
              delayMinutes: "0"
            }]
          });
        }
      });

      return activeList;
    }

    async function fetchWithRetry(url) {
      const cacheBusterUrl = `${url}${url.includes('?') ? '&' : '?'}_t=${Date.now()}`;
      for (let i = 0; i < PROXY_GENERATORS.length; i++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(PROXY_GENERATORS[i](cacheBusterUrl), { signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = JSON.parse(await res.text());
            if (data && (data.locationObjects || data.fileVersion || typeof data === 'object')) return data;
          }
        } catch (e) {}
      }
      throw new Error("通信エラー");
    }

    function buildGrid() {
      const grid = document.getElementById("diagramGrid");
      const stationMap = new Map(STATIONS.map(s => [s.row, s]));
      let html = "";

      for (let r = 1; r <= TOTAL_ROWS; r++) {
        const station = stationMap.get(r);
        const isStation = !!station;
        const rowClass = isStation ? "station-row" : "section-row";
        const singleClass = isSingleTrackRow(r) ? "is-single-track" : "";

        html += `<div class="grid-row ${rowClass} ${singleClass}" data-row="${r}">`;
        html += `<div class="grid-cell track-cell" data-col="1"></div>`;
        html += `<div class="grid-cell track-cell" data-col="2"></div>`;

        if (isStation) {
          html += `
            <div class="grid-cell station-center-cell">
              <div class="station-node"></div>
              <div class="station-info">
                <span class="station-number">${station.num}</span>
                <span class="station-name">${station.name}</span>
              </div>
            </div>`;
        } else {
          html += `<div class="grid-cell station-center-cell single-section-center"></div>`;
        }

        html += `<div class="grid-cell track-cell" data-col="3"></div>`;
        html += `<div class="grid-cell track-cell" data-col="4"></div>`;
        html += `</div>`;
      }
      grid.innerHTML = html;
    }

    async function fetchAndRender() {
      const statusBar = document.getElementById("statusBar");
      const headerAlerts = document.getElementById("headerAlerts");
      const scrollPos = window.scrollY;

      try {
        await fetchGitHubExcel();

        const data = await fetchWithRetry(TARGET_API);
        document.querySelectorAll(".train-wrapper").forEach(el => el.remove());

        const manualLocations = getActiveManualTrains();
        const rawLocations = (data && data.locationObjects) ? data.locationObjects : [];
        const combinedLocations = [...rawLocations, ...manualLocations];

        if (combinedLocations.length > 0) {
          const rowGroups = {};

          combinedLocations.forEach(loc => {
            const row = parseInt(loc.locationRow, 10);
            const col = parseInt(loc.locationCol, 10);

            if (row === 0 || isNaN(row) || col < 1 || col > 4) return;

            if (!rowGroups[row]) rowGroups[row] = { up: [], down: [] };
            const trains = loc.trainInfoObjects || [];

            if (loc.trainDirection === "1") {
              rowGroups[row].up.push(...trains);
            } else {
              rowGroups[row].down.push(...trains);
            }
          });

          if (manualScheduleList.length > 0) {
            const dayNames = { mon: "月", tue: "火", wed: "水", thu: "木", fri: "金", holiday: "土日祝" };
            headerAlerts.innerHTML = `<div class="alert-badge" style="background:#059669;">📋 ${dayNames[currentLoadedDayKey]}曜ダイヤ適用中</div>`;
          }

          let totalCount = 0;

          Object.keys(rowGroups).forEach(rowStr => {
            const row = parseInt(rowStr, 10);
            const group = rowGroups[row];
            const isSingle = isSingleTrackRow(row);
            const isStation = isStationRow(row);

            if (isSingle && !isStation) {
              const allTrains = [...group.up, ...group.down];
              if (allTrains.length > 0) {
                totalCount += allTrains.length;
                renderIconToCell(row, "center", allTrains, group.up.length > 0);
              }
            } else {
              if (group.up.length > 0) {
                totalCount += group.up.length;
                group.up.sort((a, b) => (TYPE_PRIORITY[b.trainColorType] || 0) - (TYPE_PRIORITY[a.trainColorType] || 0));
                renderIconToCell(row, 2, group.up, true);
              }

              if (group.down.length > 0) {
                totalCount += group.down.length;
                group.down.sort((a, b) => (TYPE_PRIORITY[b.trainColorType] || 0) - (TYPE_PRIORITY[a.trainColorType] || 0));
                renderIconToCell(row, 3, group.down, false);
              }
            }
          });

          statusBar.textContent = `更新: ${new Date().toLocaleTimeString()} （在線${totalCount}本）`;
        }
      } catch (err) {
        console.error(err);
        statusBar.textContent = "通信一時エラー";
      } finally {
        window.scrollTo(0, scrollPos);
      }
    }

    function renderIconToCell(row, targetCol, trains, isUp) {
      let targetCell = targetCol === "center"
        ? document.querySelector(`.grid-row[data-row="${row}"] .station-center-cell`)
        : document.querySelector(`.grid-row[data-row="${row}"] .grid-cell[data-col="${targetCol}"]`);

      if (!targetCell || trains.length === 0) return;

      const dirClass = isUp ? "train-up" : "train-down";
      const wrapper = document.createElement("div");
      wrapper.className = "train-wrapper";

      const icon = document.createElement("div");

      if (trains.length > 1) {
        icon.className = `train-icon ${dirClass} color-multi`;
        icon.innerHTML = `<div class="multi-count-box">${trains.length}</div>`;
        wrapper.appendChild(icon);
      } else {
        const info = trains[0];
        const colorType = info.trainColorType || "loc";
        const formattedTrainNum = formatTrainNumber(info.trainNumber);
        const destShortName = formatStationName(info.destStationName);
        const carsDoorsCombined = `${info.carsOfTrain || "0"}${info.doorsOfCar || "0"}`;

        icon.className = `train-icon ${dirClass} color-${colorType}`;
        const numberBox = `<div class="train-number-box">${formattedTrainNum}</div>`;
        const destBox = `<div class="train-dest-box">${destShortName}</div>`;
        const carsBadge = `<div class="train-cars-badge">${carsDoorsCombined}</div>`;

        icon.innerHTML = isUp ? `${carsBadge}${destBox}${numberBox}` : `${numberBox}${destBox}${carsBadge}`;
        wrapper.appendChild(icon);

        wrapper.onclick = (e) => {
          e.stopPropagation();
          openDetailModal(info);
        };
      }

      targetCell.appendChild(wrapper);
    }

    function closeModal(e) {
      if (!e || e.target.classList.contains('modal-overlay') || e.target.classList.contains('modal-close-btn')) {
        document.getElementById("detailModal").classList.remove("active");
      }
    }

    async function manualReload() {
      document.getElementById("statusBar").textContent = "更新中...";
      await fetchAndRender();
    }

    async function startAutoUpdate() {
      buildGrid();
      while (true) {
        await fetchAndRender();
        await new Promise(resolve => setTimeout(resolve, 5000)); // 画面位置更新を滑らかにするため5秒間隔に短縮
      }
    }

    startAutoUpdate();
  </script>
</body>
